<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta - Elegance</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <nav class="navbar">
            <div class="nav-container">
                <a href="index.html" class="logo"><h1>Elegance</h1></a>
                <ul class="nav-menu">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="index.html#products">Productos</a></li>
                    <li><a href="carrito.html">Carrito</a></li>
                </ul>
                <div class="nav-icons">
                    <a href="carrito.html" class="cart-icon">
                        <i class="fas fa-shopping-bag"></i>
                        <span class="cart-count" id="cartCount">0</span>
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <!-- CUENTA -->
    <main class="page-main">
        <div class="container account-container">

            <!-- Vista: si ya está logueado -->
            <div id="accountView" class="account-view hidden">
                <div class="account-card">
                    <div class="avatar"><i class="fas fa-user-circle"></i></div>
                    <h2>¡Hola, <span id="accName"></span>!</h2>
                    <p class="acc-email"><span id="accEmail"></span></p>
                    <div class="account-actions">
                        <a href="index.html" class="btn-primary">Ir a la Tienda</a>
                        <button class="btn-secondary" onclick="logout()">Cerrar Sesión</button>
                    </div>
                </div>
            </div>

            <!-- Vista: formularios login/registro -->
            <div id="authView">
                <div class="auth-card">
                    <div class="auth-tabs">
                        <button class="auth-tab active" data-tab="login">Iniciar Sesión</button>
                        <button class="auth-tab" data-tab="register">Crear Cuenta</button>
                    </div>

                    <!-- LOGIN -->
                    <form id="loginForm" class="auth-form">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="loginEmail" required>
                        </div>
                        <div class="form-group">
                            <label>Contraseña</label>
                            <input type="password" id="loginPassword" required>
                        </div>
                        <button type="submit" class="btn-primary">Iniciar Sesión</button>
                        <p class="auth-switch">¿No tienes cuenta? <a href="#" onclick="switchTab('register')">Regístrate</a></p>
                    </form>

                    <!-- REGISTRO -->
                    <form id="registerForm" class="auth-form hidden">
                        <div class="form-group">
                            <label>Nombre</label>
                            <input type="text" id="regFirstName" required>
                        </div>
                        <div class="form-group">
                            <label>Apellido</label>
                            <input type="text" id="regLastName" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="regEmail" required>
                        </div>
                        <div class="form-group">
                            <label>Contraseña</label>
                            <input type="password" id="regPassword" minlength="6" required>
                        </div>
                        <div class="form-group">
                            <label>Confirmar Contraseña</label>
                            <input type="password" id="regConfirm" required>
                        </div>
                        <button type="submit" class="btn-primary">Crear Cuenta</button>
                        <p class="auth-switch">¿Ya tienes cuenta? <a href="#" onclick="switchTab('login')">Inicia sesión</a></p>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Elegance. Todos los derechos reservados.</p>
            </div>
        </div>
    </footer>

    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
